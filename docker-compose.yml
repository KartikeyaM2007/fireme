services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports: ["8000:8000"]
    volumes:
      - fireme-data:/data
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  fireme-data:
